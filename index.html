<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンスリープ寝顔チェッカー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="Introduction">
        <h1>ポケモンスリープ寝顔チェッカー</h1>
        <p>取得済みの寝顔をチェックしてください。</p>
    </div>

    <div class="tab-4">
        <input type="radio" id="tab1" name="tab-4" checked>
        <label for="tab1">チェックリスト</label>
        <div class="tab-content">
            <table id="main-table">
                <thead>
                    <tr>
                        <th>Gotcha</th>
                        <th>No.</th>
                        <th>Rarity</th>
                        <th>Name</th>
                        <th>ワカクサ本島</th>
                        <th>シアンの砂浜</th>
                        <th>トープ洞窟</th>
                        <th>ウノハナ雪原</th>
                        <th>ラピスラズリ湖畔</th>
                        <th>ゴールド旧発電所</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- JavaScriptで自動生成される -->
                </tbody>
            </table>
        </div>

        <input type="radio" id="tab2" name="tab-4">
        <label for="tab2">ワカクサ本島</label>
        <div class="tab-content">
            ワカクサ本島の寝顔取得状況が表示されるタブです。
        </div>

        <!-- 他のタブは省略 -->
    </div>

    <script src="script.js"></script>
    <script>
        const sleepFaces = [
            {
                pokemon: "0001_フシギダネ",
                face: "★☆☆☆☆",
                conditions: [
                    { field: "ワカクサ本島", minRank: 2 },
                    { field: "ラピスラズリ湖畔", minRank: 1 }
                ]
            },
            {
                pokemon: "0001_フシギダネ",
                face: "★★☆☆☆",
                conditions: [
                    { field: "ワカクサ本島", minRank: 6 },
                    { field: "ラピスラズリ湖畔", minRank: 1 }
                ]
            },
            {
                pokemon: "0001_フシギダネ",
                face: "★★★☆☆",
                conditions: [
                    { field: "ラピスラズリ湖畔", minRank: 6 }
                ]
            },
            {
                pokemon: "0001_フシギダネ",
                face: "★★★★☆",
                conditions: [
                    { field: "ラピスラズリ湖畔", minRank: 6 }
                ]
            }
        ];

        const fields = ["ワカクサ本島", "シアンの砂浜", "トープ洞窟", "ウノハナ雪原", "ラピスラズリ湖畔", "ゴールド旧発電所"];

        const tbody = document.getElementById("table-body");

        sleepFaces.forEach((item, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><input type="checkbox" id="gotcha_${index}"></td>
                <td>${item.pokemon.replace("0001_", "001")}</td>
                <td>${item.face}</td>
                <td>フシギダネ</td>
                ${fields.map(f => {
                    const condition = item.conditions.find(c => c.field === f);
                    return `<td>${condition ? convertRank(condition.minRank) : ""}</td>`;
                }).join("")}
            `;
            tbody.appendChild(tr);
        });

        function convertRank(rank) {
            if (rank <= 5) return `ノーマル${rank}`;
            if (rank <= 10) return `スーパー${rank - 5}`;
            if (rank <= 15) return `ハイパー${rank - 10}`;
            return `マスター${rank - 15}`;
        }
    </script>
</body>
</html>
